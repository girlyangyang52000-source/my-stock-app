<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>記帳本</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .profit { color: #dc2626; font-weight: 600; }
        .loss { color: #16a34a; font-weight: 600; }
        .row-closed { background-color: #fff1f2 !important; color: #1f2937; }
        .row-holding { background-color: #ffffff !important; color: #111827; }
        .tight-table { width: max-content !important; border-collapse: collapse; }
        .tight-table th, .tight-table td { white-space: nowrap; padding-left: 4px !important; padding-right: 4px !important; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-2 md:p-6 text-gray-800">

    <div class="max-w-6xl mx-auto space-y-4 md:space-y-6">
        
        <!-- 頂層匯總看板 -->
        <header class="bg-white p-4 md:p-5 rounded-xl border border-gray-200 shadow-sm">
            <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-3">
                <div><h1 class="text-xl md:text-2xl font-bold">📈 記帳本</h1></div>
                <div class="flex flex-wrap gap-2">
                    <div class="bg-amber-50 px-3 py-2 rounded-lg border border-amber-200 min-w-[105px] flex flex-col justify-center">
                        <div class="text-[11px] text-amber-700 font-medium">目前總額</div>
                        <div id="statTotalCapital" class="text-base md:text-lg font-bold text-amber-800 mt-0.5">$1,191,280</div>
                    </div>
                    <div class="bg-rose-50 px-3 py-2 rounded-lg border border-rose-200 min-w-[105px] flex flex-col justify-center">
                        <div class="text-[11px] text-rose-600 font-medium">庫存</div>
                        <div id="statTotalInventory" class="text-base md:text-lg font-bold text-rose-700 mt-0.5">$436,484</div>
                    </div>
                    <div class="bg-gray-50 px-3 py-2 rounded-lg border border-gray-200 min-w-[105px] flex flex-col justify-center">
                        <div class="text-[11px] text-gray-500 font-medium">已實現損益</div>
                        <div id="statNetProfit" class="text-base md:text-lg font-bold mt-0.5 profit">+$146,280</div>
                    </div>
                    <div class="bg-purple-50 px-3 py-2 rounded-lg border border-purple-200 min-w-[105px] flex flex-col justify-center">
                        <div class="text-[11px] text-purple-700 font-medium">前期損益</div>
                        <div id="statPriorProfit" class="text-base md:text-lg font-bold text-purple-800 mt-0.5 profit">+$45,000</div>
                    </div>
                    <div class="bg-emerald-50 px-3 py-2 rounded-lg border border-emerald-200 min-w-[105px] flex flex-col justify-center">
                        <div class="text-[11px] text-emerald-700 font-medium">目前總損益</div>
                        <div id="statOverallProfit" class="text-base md:text-lg font-bold text-emerald-700 mt-0.5 profit">+$191,280</div>
                    </div>
                    <div class="bg-blue-50 px-3 py-2 rounded-lg border border-blue-200 min-w-[105px] flex flex-col justify-center">
                        <div class="text-[11px] text-blue-600 font-medium">目前剩餘額度</div>
                        <div id="statRemainingQuota" class="text-base md:text-lg font-bold text-blue-700 mt-0.5">$754,796</div>
                    </div>
                </div>
            </div>
        </header>

        <!-- 單筆錄入表單 -->
        <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
            <h2 class="text-xs md:text-sm font-semibold mb-2 flex items-center gap-1">
                <span>➕ 新增買賣記錄 (輸入單價自動計算總額)</span>
            </h2>
            <form id="tradeForm" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-8 gap-2 items-end">
                <div>
                    <label class="block text-[11px] font-medium text-gray-600 mb-0.5">交易日期</label>
                    <input type="date" id="date" required class="w-full p-1.5 border rounded-lg outline-none text-xs">
                </div>
                <div>
                    <label class="block text-[11px] font-medium text-gray-600 mb-0.5">類型</label>
                    <select id="type" class="w-full p-1.5 border rounded-lg outline-none text-xs font-semibold">
                        <option value="BUY" class="text-red-600">買 (-支出)</option>
                        <option value="SELL" class="text-green-600">賣 (+入帳)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[11px] font-medium text-gray-600 mb-0.5">公司/股票名稱</label>
                    <input type="text" id="name" placeholder="如: 鴻海" required class="w-full p-1.5 border rounded-lg outline-none text-xs">
                </div>
                <div>
                    <label class="block text-[11px] font-medium text-gray-600 mb-0.5">數量單位</label>
                    <div class="flex">
                        <input type="number" id="quantity" value="1" step="any" min="0.001" required class="w-2/3 p-1.5 border rounded-l-lg outline-none text-xs">
                        <select id="unit" class="w-1/3 p-1.5 border-y border-r rounded-r-lg bg-gray-50 text-xs">
                            <option value="張" selected>張</option>
                            <option value="股">股</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-[11px] font-medium text-gray-600 mb-0.5">單價 (可選)</label>
                    <input type="number" step="any" id="price" placeholder="如: 581" class="w-full p-1.5 border rounded-lg outline-none text-xs">
                </div>
                <div>
                    <label class="block text-[11px] font-medium text-gray-600 mb-0.5">結算總額</label>
                    <input type="number" step="any" id="totalAmount" placeholder="總額" required class="w-full p-1.5 border rounded-lg outline-none text-xs font-bold text-gray-800">
                </div>
                <div>
                    <label class="block text-[11px] font-medium text-gray-600 mb-0.5">券商折數</label>
                    <input type="number" step="0.05" id="discount" value="0.3" class="w-full p-1.5 border rounded-lg text-xs">
                </div>
                <div class="col-span-2 md:col-span-4 lg:col-span-1">
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-1.5 rounded-lg transition-colors text-xs">
                        保存記錄
                    </button>
                </div>
            </form>
        </div>

        <!-- 交易流水明細表 -->
        <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
            <div class="p-3 border-b border-gray-200 flex flex-wrap justify-between items-center gap-2 bg-gray-50">
                <div class="flex items-center gap-2.5 flex-wrap">
                    <h2 class="font-semibold text-xs md:text-sm text-gray-800">📜 買賣流水帳</h2>
                    <label class="inline-flex items-center gap-1.5 cursor-pointer text-xs font-medium text-blue-700 bg-blue-50 px-2 py-0.5 rounded border border-blue-200">
                        <input type="checkbox" id="filterHoldingCheckbox" class="w-3.5 h-3.5 text-blue-600 rounded">
                        <span>庫存股票</span>
                    </label>
                    <input type="text" id="searchStockInput" placeholder="🔍 搜股票(簡繁通用)..." class="px-2 py-0.5 text-xs border rounded-md outline-none w-36 md:w-44 bg-white">
                    <button type="button" onclick="autoFetchMarketPrices()" class="inline-flex items-center gap-1 text-xs font-semibold text-blue-700 bg-blue-50 hover:bg-blue-100 border border-blue-300 px-2.5 py-1 rounded">
                        <span id="fetchIcon">🔄</span><span id="fetchText">從財經 API 動態抓取即時時價</span>
                    </button>
                    <span class="text-[11px] text-gray-500 bg-white px-2 py-0.5 rounded border border-gray-200">
                        <span class="inline-block w-2 h-2 rounded-full bg-white border border-gray-300 mr-1"></span>白底:庫存 
                        <span class="inline-block w-2 h-2 rounded-full bg-rose-100 border border-rose-300 mx-1"></span>粉底:已結清
                    </span>
                    <div id="statLiveTotalBox" class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md bg-gray-50 border border-gray-200 text-xs shadow-sm">
                        <span class="text-gray-600 font-medium">未實現預估:</span>
                        <span id="statLiveProfitText" class="font-bold text-gray-400">$0</span>
                    </div>
                </div>
                <div class="flex items-center gap-1.5">
                    <button onclick="resetDefaultData()" class="text-[10px] md:text-xs bg-gray-100 px-2 py-0.5 rounded border">重置初始</button>
                    <button onclick="exportData()" class="text-[10px] md:text-xs bg-slate-100 px-2 py-0.5 rounded border">📥 導出</button>
                    <button onclick="clearAllRecords()" class="text-[10px] md:text-xs text-red-500 ml-1">清空</button>
                </div>
            </div>
            
            <div class="overflow-x-auto w-full">
                <table class="tight-table text-[11px] md:text-xs">
                    <thead>
                        <tr class="bg-slate-700 text-white font-medium">
                            <th class="py-2 text-left rounded-tl-lg">日期</th>
                            <th class="py-2 text-center">類型</th>
                            <th class="py-2 text-left">名稱</th>
                            <th class="py-2 text-left">數量</th>
                            <th class="py-2 text-right">單價</th>
                            <th class="py-2 text-right">結算總額</th>
                            <th class="py-2 text-center bg-slate-800 text-amber-300">💡 即時現價 (點擊按鈕動態抓取市價)</th>
                            <th class="py-2 text-right">本次損益</th>
                            <th class="py-2 text-right">報酬率</th>
                            <th class="py-2 text-center rounded-tr-lg">操作</th>
                        </tr>
                    </thead>
                    <tbody id="recordTableBody" class="divide-y divide-gray-100"></tbody>
                </table>
            </div>
            <div id="emptyState" class="p-6 text-center text-gray-400 hidden text-xs">尚無匹配的買賣記錄。</div>
        </div>
    </div>

    <!-- 編輯模態彈窗 -->
    <div id="editModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-xl shadow-xl border border-gray-200 max-w-sm w-full p-4 space-y-3">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="font-bold text-gray-800 text-sm">✏️ 編輯交易記錄</h3>
                <button type="button" onclick="closeEditModal()" class="text-gray-400">✕</button>
            </div>
            <form id="editForm" class="grid grid-cols-2 gap-2 text-xs">
                <input type="hidden" id="editId">
                <div><label>交易日期</label><input type="date" id="editDate" required class="w-full p-1.5 border rounded-lg"></div>
                <div><label>類型</label><select id="editType" class="w-full p-1.5 border rounded-lg font-semibold"><option value="BUY">買</option><option value="SELL">賣</option></select></div>
                <div class="col-span-2"><label>名稱</label><input type="text" id="editName" required class="w-full p-1.5 border rounded-lg"></div>
                <div><label>數量</label><input type="number" id="editQuantity" step="any" required class="w-full p-1.5 border rounded-lg"></div>
                <div><label>單位</label><select id="editUnit" class="w-full p-1.5 border rounded-lg"><option value="張">張</option><option value="股">股</option></select></div>
                <div><label>單價</label><input type="number" step="any" id="editPrice" class="w-full p-1.5 border rounded-lg"></div>
                <div><label>券商折數</label><input type="number" step="0.05" id="editDiscount" value="0.3" class="w-full p-1.5 border rounded-lg"></div>
                <div class="col-span-2"><label>結算總額</label><input type="number" step="any" id="editTotalAmount" required class="w-full p-1.5 border rounded-lg font-bold"></div>
                <div class="col-span-2 flex justify-end gap-2 pt-1">
                    <button type="button" onclick="closeEditModal()" class="px-3 py-1 bg-gray-100 rounded-lg">取消</button>
                    <button type="submit" class="px-3 py-1 bg-blue-600 text-white rounded-lg">保存</button>
                </div>
            </form>
        </div>
    </div>

        function calcTotal() {
            const type = document.getElementById('type').value;
            const unit = document.getElementById('unit').value;
            const quantity = parseFloat(document.getElementById('quantity').value) || 0;
            const price = parseFloat(document.getElementById('price').value) || 0;
            const discount = parseFloat(document.getElementById('discount').value) || 0.3;

            if (price <= 0 || quantity <= 0) return;

            const shares = (unit === '張' || unit === '张') ? quantity * 1000 : quantity;
            const rawAmount = price * shares;
            const fee = Math.max(20, Math.floor(rawAmount * BASE_FEE_RATE * discount));

            if (type === 'BUY') {
                document.getElementById('totalAmount').value = Math.round(rawAmount + fee);
            } else {
                const tax = Math.floor(rawAmount * TAX_RATE);
                document.getElementById('totalAmount').value = Math.round(rawAmount - fee - tax);
            }
        }

        function formatSlashDate(dStr) { return dStr ? dStr.replace(/-/g, '/') : ''; }
        function formatPrice(val) {
            if (val === null || val === undefined || val === '' || isNaN(val)) return '-';
            const num = Number(val);
            return '$' + (num % 1 === 0 ? num : parseFloat(num.toFixed(2)));
        }

        function getRecordShares(r) {
            if (r.shares && !isNaN(r.shares)) return Number(r.shares);
            const q = parseFloat(r.quantity) || 1;
            const u = r.unit || '張';
            return (u === '張' || u === '张') ? q * 1000 : q;
        }

        function calculateAutoStatus(items) {
            const activeBuys = [];
            const activeSells = [];
            items.forEach(r => {
                const stockKey = (r.name || '').trim();
                const shares = getRecordShares(r);
                const totalAmount = Math.abs(parseFloat(r.totalAmount) || 0);
                if (r.isHistorical && r.type === 'SELL') return;
                if (r.type === 'BUY') {
                    if (r.isHistorical) return;
                    activeBuys.push({ id: String(r.id), date: r.date, name: stockKey, shares, remainingShares: shares, costPerShare: shares > 0 ? (totalAmount / shares) : 0, totalAmount });
                } else {
                    activeSells.push({ id: String(r.id), date: r.date, name: stockKey, shares, totalAmount, fixedProfit: r.fixedProfit });
                }
            });
            activeSells.sort((a, b) => new Date(a.date) - new Date(b.date) || (a.id || 0) - (b.id || 0));
            const closedBuyIds = new Set();
            const dynamicProfitMap = {};
            let newRealizedProfit = 0;

            activeSells.forEach(sell => {
                let sellSharesNeeded = sell.shares;
                let matchedCost = 0;
                const sameDayBuys = activeBuys.filter(b => b.name === sell.name && b.date === sell.date && b.remainingShares > 0);
                for (let buy of sameDayBuys) {
                    if (sellSharesNeeded <= 0) break;
                    const matchAmount = Math.min(buy.remainingShares, sellSharesNeeded);
                    matchedCost += matchAmount * buy.costPerShare;
                    buy.remainingShares -= matchAmount;
                    sellSharesNeeded -= matchAmount;
                    if (buy.remainingShares === 0) closedBuyIds.add(buy.id);
                }
                if (sellSharesNeeded > 0) {
                    const priorBuys = activeBuys.filter(b => b.name === sell.name && new Date(b.date) <= new Date(sell.date) && b.remainingShares > 0).sort((a, b) => new Date(a.date) - new Date(b.date) || (a.id || 0) - (b.id || 0));
                    for (let buy of priorBuys) {
                        if (sellSharesNeeded <= 0) break;
                        const matchAmount = Math.min(buy.remainingShares, sellSharesNeeded);
                        matchedCost += matchAmount * buy.costPerShare;
                        buy.remainingShares -= matchAmount;
                        sellSharesNeeded -= matchAmount;
                        if (buy.remainingShares === 0) closedBuyIds.add(buy.id);
                    }
                }
                let profit = sell.fixedProfit !== undefined ? sell.fixedProfit : (matchedCost > 0 ? Math.round(sell.totalAmount - matchedCost) : 0);
                let returnRate = (matchedCost > 0 && profit !== null) ? ((profit / matchedCost) * 100).toFixed(2) : null;
                newRealizedProfit += profit;
                dynamicProfitMap[sell.id] = { profit, returnRate };
            });

            let currentInventoryCost = 0;
            const holdingBuyIds = new Set();
            activeBuys.forEach(buy => {
                if (buy.remainingShares > 0) {
                    holdingBuyIds.add(buy.id);
                    currentInventoryCost += Math.round(buy.remainingShares * buy.costPerShare);
                }
            });
            const totalRealizedProfit = HISTORICAL_PROFIT_BASE + newRealizedProfit;
            return { closedBuyIds, holdingBuyIds, dynamicProfitMap, currentInventoryCost, totalRealizedProfit };
        }

        function calculateLiveSellProfitCorrect(costTotalAmount, shares, livePrice, discount = 0.3) {
            if (!livePrice || isNaN(livePrice) || livePrice <= 0) return null;
            const gross = livePrice * shares;
            const fee = Math.max(20, Math.floor(gross * BASE_FEE_RATE * discount));
            const tax = Math.floor(gross * TAX_RATE);
            const netIncome = Math.round(gross - fee - tax);
            const profit = netIncome - costTotalAmount;
            const returnRate = ((profit / costTotalAmount) * 100).toFixed(2);
            return { netIncome, profit, returnRate };
        }

        function calculateBreakEvenPrice(costAmount, shares, discount = 0.3) {
            if (!shares || shares <= 0) return null;
            const effectiveRate = (BASE_FEE_RATE * discount) + TAX_RATE;
            return ((costAmount + 20) / (shares * (1 - effectiveRate))).toFixed(2);
        }

            const { holdingBuyIds } = calculateAutoStatus(records);
            records.forEach(r => {
                if (r.type === 'BUY' && holdingBuyIds.has(String(r.id))) {
                    const cachedVal = livePriceCache[r.id];
                    if (cachedVal !== null && cachedVal !== '' && !isNaN(cachedVal) && parseFloat(cachedVal) > 0) {
                        const totalAmount = Math.abs(parseFloat(r.totalAmount) || 0);
                        const shares = getRecordShares(r);
                        const discount = r.discount !== undefined ? r.discount : 0.3;
                        const calc = calculateLiveSellProfitCorrect(totalAmount, shares, parseFloat(cachedVal), discount);
                        if (calc) { totalSimProfit += calc.profit; totalSimCost += totalAmount; hasInput = true; }
                    }
                }
            });
            const box = document.getElementById('statLiveTotalBox'), txt = document.getElementById('statLiveProfitText');
            if (!box || !txt) return;
            if (!hasInput) {
                txt.className = "font-bold text-gray-400"; txt.innerText = "$0";
                box.className = "inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md bg-gray-50 border border-gray-200 text-xs shadow-sm";
            } else {
                const sign = totalSimProfit > 0 ? '+' : '';
                const retRate = totalSimCost > 0 ? ((totalSimProfit / totalSimCost) * 100).toFixed(2) : '0.00';
                txt.className = `font-bold ${totalSimProfit >= 0 ? 'profit' : 'loss'}`;
                txt.innerText = totalSimProfit < 0 ? `$-${Math.abs(totalSimProfit).toLocaleString()} (${retRate}%)` : `${sign}$${totalSimProfit.toLocaleString()} (${sign}${retRate}%)`;
                box.className = totalSimProfit >= 0 ? "inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md bg-red-50 border border-red-300 text-xs shadow-sm" : "inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md bg-emerald-50 border border-emerald-300 text-xs shadow-sm";
            }
        }

        function onLivePriceChange(recordId, costAmount, shares, discount, inputVal) {
            livePriceCache[recordId] = inputVal;
            const resDiv = document.getElementById(`live-result-${recordId}`);
            const val = parseFloat(inputVal);
            if (isNaN(val) || val <= 0) {
                if (resDiv) resDiv.innerHTML = `<span class="text-[10px] text-gray-400">保本價 ≈ $${calculateBreakEvenPrice(costAmount, shares, discount)}</span>`;
            } else {
                const calc = calculateLiveSellProfitCorrect(costAmount, shares, val, discount);
                if (calc && resDiv) {
                    resDiv.innerHTML = `<div class="${calc.profit >= 0 ? 'profit' : 'loss'} font-bold leading-tight">${calc.profit > 0 ? '+' : ''}$${calc.profit.toLocaleString()} (${calc.profit > 0 ? '+' : ''}${calc.returnRate}%)</div><div class="text-[9px] text-gray-500">淨收 $${calc.netIncome.toLocaleString()}</div>`;
                }
            }
            updateLiveOverallSummary();
        }

        // 終極改善：透過後端 API 代理安全抓取真實證交所/櫃買中心即時行情
        async function autoFetchMarketPrices() {
            const { holdingBuyIds } = calculateAutoStatus(records);
            const holdingItems = records.filter(r => r.type === 'BUY' && holdingBuyIds.has(String(r.id)));
            if (holdingItems.length === 0) {
                alert("目前沒有庫存股票可抓取！");
                return;
            }
            
            const targetCodes = [];
            holdingItems.forEach(r => {
                const cleanName = r.name.trim().replace(/^[0-9A-Za-z]+/, '').trim();
                const code = STOCK_CODE_MAP[r.name.trim()] || STOCK_CODE_MAP[cleanName];
                if (code && !targetCodes.includes(code)) {
                    targetCodes.push(code);
                }
            });

            if (targetCodes.length === 0) {
                alert("找不到庫存股票的對應代號，請確認股票名稱是否在對照表中。");
                return;
            }

            const btnIcon = document.getElementById('fetchIcon'), btnText = document.getElementById('fetchText');
            btnIcon.classList.add('animate-spin'); 
            btnText.innerText = "正在透過後端代理向市場請求報價...";

            try {
                // 呼叫我們專屬的 Cloudflare Pages Functions 後端，繞過 CORS 與防爬蟲限制
                const res = await fetch(`/stock?codes=${targetCodes.join(',')}`);
                const result = await res.json();
                
                if (result.success && Array.isArray(result.data)) {
                    const priceMap = {};
                    result.data.forEach(item => {
                        if (item.Code && item.ClosingPrice) {
                            priceMap[String(item.Code).trim()] = parseFloat(String(item.ClosingPrice).replace(/,/g, ''));
                        }
                    });

                    let updatedCount = 0;
                    holdingItems.forEach(r => {
                        const cleanName = r.name.trim().replace(/^[0-9A-Za-z]+/, '').trim();
                        const code = STOCK_CODE_MAP[r.name.trim()] || STOCK_CODE_MAP[cleanName];
                        const livePrice = code ? priceMap[code] : null;

                        if (livePrice && !isNaN(livePrice) && livePrice > 0) {
                            livePriceCache[r.id] = String(livePrice);
                            const inp = document.getElementById(`live-input-${r.id}`);
                            if (inp) inp.value = livePrice;
                            const discount = r.discount !== undefined ? r.discount : 0.3;
                            onLivePriceChange(r.id, Math.abs(parseFloat(r.totalAmount) || 0), getRecordShares(r), discount, String(livePrice));
                            updatedCount++;
                        }
                    });
                    btnText.innerText = updatedCount > 0 ? `成功抓取 ${updatedCount} 檔時價` : "已完成同步抓取";
                } else {
                    btnText.innerText = "API 回應異常";
                }
            } catch (err) {
                btnText.innerText = "無法連線至後端代理";
            } finally {
                btnIcon.classList.remove('animate-spin');
                setTimeout(() => { btnText.innerText = "從財經 API 動態抓取即時時價"; }, 3000);
            }
        }

        function renderTable() {
            const tbody = document.getElementById('recordTableBody'), emptyState = document.getElementById('emptyState');
            tbody.innerHTML = '';
            const { holdingBuyIds, dynamicProfitMap, currentInventoryCost, totalRealizedProfit } = calculateAutoStatus(records);
            const isFilterHolding = document.getElementById('filterHoldingCheckbox').checked;
            const searchKeyword = normalizeChinese(document.getElementById('searchStockInput').value || '');
            let displayRecords = [...records].sort((a, b) => new Date(b.date) - new Date(a.date) || (b.id || 0) - (a.id || 0));

            if (isFilterHolding) displayRecords = displayRecords.filter(r => r.type === 'BUY' && holdingBuyIds.has(String(r.id)));
            if (searchKeyword) displayRecords = displayRecords.filter(r => normalizeChinese(r.name).includes(searchKeyword));
            emptyState.classList.toggle('hidden', displayRecords.length > 0);

            const overallProfit = totalRealizedProfit + PRIOR_PROFIT;
            const totalCapital = BASE_CAPITAL + overallProfit;

            displayRecords.forEach(r => {
                const totalAmount = Math.abs(parseFloat(r.totalAmount) || 0);
                const isBuy = r.type === 'BUY';
                const isHolding = isBuy && holdingBuyIds.has(String(r.id));
                const shares = getRecordShares(r);
                const discount = r.discount !== undefined ? r.discount : 0.3;
                let profitHtml = '<span class="text-gray-400">-</span>', returnRateHtml = '<span class="text-gray-400">-</span>', p = null, rr = null;

                if (!isBuy) {
                    if (r.fixedProfit !== undefined) { p = r.fixedProfit; rr = ((p / (totalAmount - p)) * 100).toFixed(2); }
                    else if (dynamicProfitMap[String(r.id)]) { p = dynamicProfitMap[String(r.id)].profit; rr = dynamicProfitMap[String(r.id)].returnRate; }
                }
                if (p !== null) {
                    profitHtml = `<span class="${p >= 0 ? 'profit' : 'loss'}">${p > 0 ? '+' : ''}$${Math.abs(p).toLocaleString()}</span>`;
                    returnRateHtml = rr ? `<span class="${p >= 0 ? 'profit' : 'loss'}">${p > 0 ? '+' : ''}${rr}%</span>` : '<span class="text-gray-400">-</span>';
                }

                let liveSimHtml = '<span class="text-gray-300 text-[10px]">已結清</span>';
                if (isHolding) {
                    let initialResult = `<span class="text-[10px] text-gray-400">保本價 ≈ $${calculateBreakEvenPrice(totalAmount, shares, discount)}</span>`;
                    liveSimHtml = `<div class="flex items-center gap-1.5 justify-end"><input type="number" step="any" placeholder="現價" value="" id="live-input-${r.id}" oninput="onLivePriceChange('${r.id}', ${totalAmount}, ${shares}, ${discount}, this.value)" class="w-20 px-1.5 py-0.5 text-xs text-right border border-amber-300 rounded bg-amber-50/50 outline-none font-semibold"><div id="live-result-${r.id}" class="text-right min-w-[82px] text-[10px]">${initialResult}</div></div>`;
                }

                const tr = document.createElement('tr');
                tr.className = isHolding ? "row-holding border-b border-gray-100" : "row-closed border-b border-rose-200";
                tr.innerHTML = `
                    <td class="py-2 text-left">${formatSlashDate(r.date)}</td>
                    <td class="py-2 text-center"><span class="px-1 py-0.5 rounded text-[10px] font-bold ${isBuy ? 'bg-red-50 text-red-600 border border-red-200' : 'bg-green-50 text-green-600 border border-green-200'}">${isBuy ? '買' : '賣'}</span></td>
                    <td class="py-2 text-left font-bold">${r.name}</td>
                    <td class="py-2 text-left">${r.quantity || 1}${r.unit || '張'}</td>
                    <td class="py-2 text-right text-gray-600">${formatPrice(r.price)}</td>
                    <td class="py-2 text-right ${isBuy ? 'text-gray-700' : 'text-green-600 font-bold'}">${isBuy ? '-' : '+'}$${totalAmount.toLocaleString()}</td>
                    <td class="py-1.5 px-2 text-right border-x border-gray-100 bg-amber-50/20">${liveSimHtml}</td>
                    <td class="py-2 text-right">${profitHtml}</td>
                    <td class="py-2 text-right">${returnRateHtml}</td>
                    <td class="py-2 text-center">
                        <button type="button" onclick="openEditModal('${r.id}')" class="text-blue-500 mr-1">✏️</button>
                        <button type="button" onclick="deleteRecord('${r.id}')" class="text-gray-400 hover:text-red-600">✕</button>
                    </td>`;
                tbody.appendChild(tr);
            });

            document.getElementById('statTotalCapital').innerText = `$${totalCapital.toLocaleString()}`;
            document.getElementById('statTotalInventory').innerText = `$${currentInventoryCost.toLocaleString()}`;
            document.getElementById('statNetProfit').innerText = `+$${totalRealizedProfit.toLocaleString()}`;
            document.getElementById('statPriorProfit').innerText = `+$${PRIOR_PROFIT.toLocaleString()}`;
            document.getElementById('statOverallProfit').innerText = `+$${overallProfit.toLocaleString()}`;
            document.getElementById('statRemainingQuota').innerText = `$${(totalCapital - currentInventoryCost).toLocaleString()}`;
            updateLiveOverallSummary();
        }

        document.getElementById('tradeForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const q = parseFloat(document.getElementById('quantity').value) || 1;
            const u = document.getElementById('unit').value;
            records.push({
                id: String(Date.now()),
                date: document.getElementById('date').value,
                type: document.getElementById('type').value,
                name: document.getElementById('name').value.trim(),
                quantity: q,
                unit: u,
                shares: ((u === '張' || u === '张') ? q * 1000 : q),
                price: parseFloat(document.getElementById('price').value) || null,
                discount: parseFloat(document.getElementById('discount').value) || 0.3,
                totalAmount: Math.abs(parseFloat(document.getElementById('totalAmount').value)),
                isHistorical: false
            });
            saveAndRefresh();
            document.getElementById('name').value = '';
            document.getElementById('price').value = '';
            document.getElementById('totalAmount').value = '';
            alert('保存成功！');
        });

        function openEditModal(id) {
            const r = records.find(item => String(item.id) === String(id));
            if (!r) return;
            document.getElementById('editId').value = r.id;
            document.getElementById('editDate').value = r.date;
            document.getElementById('editType').value = r.type;
            document.getElementById('editName').value = r.name;
            document.getElementById('editQuantity').value = r.quantity || 1;
            document.getElementById('editUnit').value = r.unit || '張';
            document.getElementById('editPrice').value = r.price !== null ? r.price : '';
            document.getElementById('editDiscount').value = r.discount !== undefined ? r.discount : 0.3;
            document.getElementById('editTotalAmount').value = Math.abs(r.totalAmount);
            document.getElementById('editModal').classList.remove('hidden');
        }

        function closeEditModal() { document.getElementById('editModal').classList.add('hidden'); }

        document.getElementById('editForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const id = document.getElementById('editId').value;
            const idx = records.findIndex(item => String(item.id) === String(id));
            if (idx === -1) return;
            const q = parseFloat(document.getElementById('editQuantity').value) || 1;
            const u = document.getElementById('editUnit').value;
            const p = document.getElementById('editPrice').value;
            records[idx] = {
                ...records[idx],
                date: document.getElementById('editDate').value,
                type: document.getElementById('editType').value,
                name: document.getElementById('name').value.trim(),
                quantity: q,
                unit: u,
                shares: ((u === '張' || u === '张') ? q * 1000 : q),
                price: p !== '' ? parseFloat(p) : null,
                discount: parseFloat(document.getElementById('discount').value) || 0.3,
                totalAmount: Math.abs(parseFloat(document.getElementById('editTotalAmount').value))
            };
            saveAndRefresh();
            closeEditModal();
        });

        function saveAndRefresh() {
            localStorage.setItem('stock_flow_records', JSON.stringify(records));
            renderTable();
        }

        function deleteRecord(id) { if (confirm("確定刪除？")) { records = records.filter(r => String(r.id) !== String(id)); saveAndRefresh(); } }
        function clearAllRecords() { if (confirm("確定清空？")) { records = []; saveAndRefresh(); updateLiveOverallSummary(); } }
        function resetDefaultData() { if (confirm("重置初始？")) { records = DEFAULT_RECORDS; saveAndRefresh(); } }
        function exportData() { navigator.clipboard.writeText(JSON.stringify(records, null, 2)).then(() => alert("已複製到剪貼簿！")); }
    </script>
</body>
</html>
